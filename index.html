<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Alypay — Boletim Anti-Calote</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141c;
    --surface-2: #1a1a24;
    --border: #2a2a38;
    --text: #f5f5f7;
    --muted: #9497a6;
    --danger: #ff4d4d;
    --ok: #3ddc84;
    --acc-a: #ff2d78;
    --acc-b: #7c2dff;
    --acc-c: #00e5ff;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; }

  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 90px;
    min-height: 100%;
  }

  a { color: var(--acc-c); }

  .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .title { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0 20px; }

  /* ---------- credit card ---------- */
  .cc {
    border-radius: 20px;
    padding: 22px 20px 20px;
    background: linear-gradient(135deg, var(--acc-a), var(--acc-b) 55%, var(--acc-c));
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 22px 44px -22px rgba(255,45,120,0.5);
    color: #fff;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .cc + .cc { margin-top: 18px; }
  .cc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 18px; }
  .cc-name-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cc-name {
    font-weight: 700;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cc-edit-btn {
    border: none; background: rgba(0,0,0,0.28); color: #fff;
    width: 26px; height: 26px; border-radius: 999px; cursor: pointer;
    flex-shrink: 0; font-size: 0.8rem; line-height: 1;
  }
  .cc-status {
    font-size: 0.76rem; padding: 4px 10px; border-radius: 999px;
    background: rgba(0,0,0,0.32); white-space: nowrap; flex-shrink: 0;
  }
  .cc-balance-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.8; margin-bottom: 4px; }
  .cc-balance {
    font-family: var(--mono); font-size: 2rem; font-weight: 600; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  }
  .cc-balance .chev { font-size: 0.8rem; opacity: 0.75; transition: transform 0.15s; }
  .cc-balance.expanded .chev { transform: rotate(180deg); }
  .cc-sub { display: flex; gap: 22px; margin-top: 14px; font-size: 0.82rem; }
  .cc-sub b { display: block; font-family: var(--mono); font-size: 1rem; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .cc-bar-track { margin-top: 14px; height: 6px; border-radius: 999px; overflow: hidden; background: rgba(0,0,0,0.32); }
  .cc-bar-fill { height: 100%; background: #fff; transition: width 0.3s; }
  .cc-pct { font-size: 0.72rem; opacity: 0.85; margin-top: 6px; }
  .cc-actions { display: flex; gap: 8px; margin-top: 16px; }
  .cc-actions button {
    flex: 1; border: 1px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.18);
    color: #fff; border-radius: 10px; padding: 8px 6px; font-size: 0.74rem; cursor: pointer;
  }
  .cc-pending {
    display: inline-block; margin-top: 10px; font-size: 0.74rem;
    background: rgba(0,0,0,0.32); border-radius: 999px; padding: 5px 11px;
  }

  .cc-breakdown {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.22);
    display: flex; flex-direction: column; gap: 8px;
  }
  .cc-breakdown-item { display: flex; justify-content: space-between; gap: 10px; font-size: 0.82rem; }
  .cc-breakdown-item .desc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cc-breakdown-item .val { font-family: var(--mono); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .cc-breakdown-empty { font-size: 0.8rem; opacity: 0.8; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 6px; margin: 20px 0 16px; overflow-x: auto; padding-bottom: 2px; }
  .tab {
    font-size: 0.8rem; font-weight: 600; padding: 9px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .tab.active { background: linear-gradient(135deg, var(--acc-a), var(--acc-c)); border-color: transparent; color: #0a0a0f; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px; margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 14px; font-size: 0.95rem; }

  /* ---------- month nav ---------- */
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .month-nav .lbl { font-size: 1rem; font-weight: 700; text-transform: capitalize; }
  .month-nav button {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 1rem;
  }
  .month-nav .today-btn { width: auto; padding: 0 12px; font-size: 0.76rem; }

  /* ---------- forms ---------- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 11px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 0.92rem;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--acc-c); outline-offset: 1px; }
  .preview-line {
    font-family: var(--mono); font-size: 0.86rem; color: var(--acc-c);
    background: rgba(0,229,255,0.08); border: 1px dashed rgba(0,229,255,0.35);
    border-radius: 10px; padding: 8px 10px; margin-bottom: 14px;
  }
  .btn {
    width: 100%; padding: 12px; border-radius: 12px; border: none; cursor: pointer;
    font-weight: 700; font-size: 0.92rem;
  }
  .btn-primary { background: linear-gradient(135deg, var(--acc-a), var(--acc-c)); color: #0a0a0f; }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .form-error { color: var(--danger); font-size: 0.82rem; margin: -6px 0 12px; }

  /* ---------- fatura / historico lists ---------- */
  .line-group + .line-group { margin-top: 18px; }
  .line-group-title {
    font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    margin-bottom: 8px; display: flex; justify-content: space-between;
  }
  .line-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .line-item:last-child { border-bottom: none; }
  .line-item .info { min-width: 0; }
  .line-item .desc { font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line-item .meta { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
  .line-item .val { font-family: var(--mono); font-variant-numeric: tabular-nums; flex-shrink: 0; font-size: 0.92rem; }
  .line-item .del {
    border: none; background: transparent; color: var(--danger); cursor: pointer; font-size: 0.76rem;
    flex-shrink: 0; padding: 4px 6px;
  }
  .badge-parc {
    font-family: var(--mono); font-size: 0.7rem; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; margin-left: 6px;
  }

  .empty { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 0.88rem; }
  .empty .big { font-size: 1.8rem; margin-bottom: 8px; }

  /* ---------- login / error ---------- */
  .center-screen { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 6px; }
  .center-screen .big-emoji { font-size: 2.6rem; margin-bottom: 6px; }
  .login-box { width: 100%; max-width: 320px; margin-top: 18px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .toolbar button { flex: 1; min-width: 130px; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 16px; border-radius: 999px; font-size: 0.82rem; z-index: 50;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .footer-note { text-align: center; font-size: 0.72rem; color: var(--muted); margin-top: 26px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================== estado ============================== */
const state = {
  route: 'loading', // loading | admin-login | admin | primo | error
  errorMsg: '',
  adminPassword: sessionStorage.getItem('alypay_admin_pw') || '',
  loginError: '',
  data: null,        // admin: {primos, compras, pagamentos} | primo: {primo, compras, pagamentos}
  token: '',         // token do primo logado (rota /?t=...), usado pra ele lançar coisas
  activeTab: 'fatura',
  mes: mesAtual(),
  expandidos: new Set(),
  toast: null,
};

/* ============================== lógica pura ============================== */
function mesAtual() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function formatBRL(n) {
  return (n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function formatMes(mes) {
  const [y, m] = mes.split('-').map(Number);
  const nomes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${nomes[m - 1]} de ${y}`;
}
function somaMes(mes, delta) {
  const [y, m] = mes.split('-').map(Number);
  const total = (m - 1) + delta;
  const ny = y + Math.floor(total / 12);
  const nm = ((total % 12) + 12) % 12 + 1;
  return `${ny}-${String(nm).padStart(2, '0')}`;
}
// "Recorrente" = cobrança sem fim (ex: assinatura). Representada com
// parcelas = null; "total" nesse caso é o valor cobrado todo mês.
function isRecorrente(compra) { return compra.parcelas === null || compra.parcelas === undefined; }

// Quantos meses existem de "a" até "b", inclusive nas duas pontas
// (0 ou negativo se "b" vier antes de "a").
function mesesEntreInclusive(a, b) {
  const [y1, m1] = a.split('-').map(Number);
  const [y2, m2] = b.split('-').map(Number);
  return Math.max(0, (y2 - y1) * 12 + (m2 - m1) + 1);
}

function parcelaValor(compra, index) {
  if (isRecorrente(compra)) return compra.total;
  const base = Math.floor((compra.total / compra.parcelas) * 100) / 100;
  const soma = round2(base * (compra.parcelas - 1));
  const ultima = round2(compra.total - soma);
  return index === compra.parcelas - 1 ? ultima : base;
}

// Retorna a parcela (índice + valor) dessa compra que cai no mês
// informado, ou null se essa compra não tem nada vencendo nesse mês.
function parcelaNoMes(compra, mes) {
  const idx = mesesEntreInclusive(compra.inicio_mes, mes) - 1;
  if (idx < 0) return null;
  if (!isRecorrente(compra) && idx >= compra.parcelas) return null;
  return { index: idx, mes, valor: parcelaValor(compra, idx), recorrente: isRecorrente(compra) };
}

// Quanto dessa compra já "venceu" (ficou devido) até o mês de referência.
function totalAcumuladoAte(compra, mesRef) {
  if (isRecorrente(compra)) {
    return round2(mesesEntreInclusive(compra.inicio_mes, mesRef) * compra.total);
  }
  const decorridos = Math.min(compra.parcelas, mesesEntreInclusive(compra.inicio_mes, mesRef));
  if (decorridos <= 0) return 0;
  if (decorridos >= compra.parcelas) return Number(compra.total);
  const base = Math.floor((compra.total / compra.parcelas) * 100) / 100;
  return round2(base * decorridos);
}

function somaPagamentos(pagamentos) { return round2(pagamentos.reduce((s, p) => s + Number(p.valor), 0)); }

// Só lançamentos aprovados contam pro saldo. Itens sem "status" (backups
// antigos, de antes dessa coluna existir) são tratados como aprovados.
function aprovados(lista) { return lista.filter((x) => x.status === 'aprovado' || x.status === undefined); }

function formatData(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// Soma das compras pra fins de "saldo total": parceladas entram pelo
// total cheio (é um compromisso fechado); recorrentes entram só pelo
// quanto já venceu até hoje (não têm um "total futuro" definido).
function somaComprasParaSaldo(compras) {
  const hoje = mesAtual();
  return round2(compras.reduce((s, c) => s + (isRecorrente(c) ? totalAcumuladoAte(c, hoje) : Number(c.total)), 0));
}

function saldoTotal(compras, pagamentos) { return round2(somaComprasParaSaldo(compras) - somaPagamentos(pagamentos)); }

function saldoVencido(compras, pagamentos, mesRef) {
  const vencidas = compras.reduce((s, c) => s + totalAcumuladoAte(c, mesRef), 0);
  return Math.max(0, round2(vencidas - somaPagamentos(pagamentos)));
}

function pctQuitado(compras, pagamentos) {
  const total = somaComprasParaSaldo(compras);
  const pago = somaPagamentos(pagamentos);
  if (total <= 0) return pago > 0 ? 100 : 0;
  return Math.min(100, Math.round((pago / total) * 100));
}

function faturaDoMes(compras, mes) {
  const linhas = [];
  for (const c of compras) {
    const p = parcelaNoMes(c, mes);
    if (p) linhas.push({ compra: c, parcela: p });
  }
  return linhas;
}
function statusPrimo(saldo) {
  if (saldo <= 0) return { emoji: '😇', label: 'Primo Exemplar' };
  if (saldo <= 200) return { emoji: '🙂', label: 'Devedor Simpático' };
  if (saldo <= 500) return { emoji: '🫠', label: 'Fase Enrolação' };
  if (saldo <= 1500) return { emoji: '😬', label: 'Caloteiro Júnior' };
  return { emoji: '🚨', label: 'Caloteiro Sênior' };
}
function parcelaBadge(l) {
  if (l.compra.tipo === 'emprestimo') return 'empréstimo';
  return l.parcela.recorrente ? 'eterno' : `${l.parcela.index + 1}/${l.compra.parcelas}`;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ============================== API ============================== */
const API = {
  async primo(token) {
    const res = await fetch(`/api/primo?t=${encodeURIComponent(token)}`);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Erro ao carregar.');
    return body;
  },
  async adminLogin(password) {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    return res.ok;
  },
  async adminData(password) {
    const res = await fetch('/api/admin/data', { headers: { 'X-Admin-Password': password } });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Erro ao carregar.');
    return body;
  },
  async createCompra(password, payload) {
    const res = await fetch('/api/admin/compra', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Erro ao salvar compra.');
    return body;
  },
  async deleteCompra(password, id) {
    const res = await fetch(`/api/admin/compra/${id}`, { method: 'DELETE', headers: { 'X-Admin-Password': password } });
    if (!res.ok) throw new Error('Erro ao excluir compra.');
  },
  async patchCompraStatus(password, id, status) {
    const res = await fetch(`/api/admin/compra/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
      body: JSON.stringify({ status }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Erro ao atualizar compra.');
    return body;
  },
  async createPagamento(password, payload) {
    const res = await fetch('/api/admin/pagamento', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Erro ao salvar pagamento.');
    return body;
  },
  async deletePagamento(password, id) {
    const res = await fetch(`/api/admin/pagamento/${id}`, { method: 'DELETE', headers: { 'X-Admin-Password': password } });
    if (!res.ok) throw new Error('Erro ao excluir pagamento.');
  },
  async patchPagamentoStatus(password, id, status) {
    const res = await fetch(`/api/admin/pagamento/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
      body: JSON.stringify({ status }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Erro ao atualizar pagamento.');
    return body;
  },
  async createCompraPrimo(token, payload) {
    const res = await fetch('/api/primo/compra', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, ...payload }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Erro ao enviar compra.');
    return body;
  },
  async createPagamentoPrimo(token, payload) {
    const res = await fetch('/api/primo/pagamento', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, ...payload }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Erro ao enviar pagamento.');
    return body;
  },
  async updatePrimo(password, id, patch) {
    const res = await fetch(`/api/admin/primo/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
      body: JSON.stringify(patch),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Erro ao atualizar primo.');
    return body;
  },
  async importBackup(password, payload) {
    const res = await fetch('/api/admin/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Erro ao importar backup.');
    return body;
  },
};

/* ============================== boot / roteamento ============================== */
async function boot() {
  const params = new URLSearchParams(location.search);
  const token = params.get('t');

  if (location.pathname.replace(/\/$/, '') === '/admin') {
    if (state.adminPassword) {
      try {
        state.data = await API.adminData(state.adminPassword);
        state.route = 'admin';
      } catch {
        sessionStorage.removeItem('alypay_admin_pw');
        state.adminPassword = '';
        state.route = 'admin-login';
      }
    } else {
      state.route = 'admin-login';
    }
  } else if (token) {
    state.token = token;
    try {
      state.data = await API.primo(token);
      state.route = 'primo';
    } catch (err) {
      state.route = 'error';
      state.errorMsg = err.message || 'Link inválido.';
    }
  } else {
    state.route = 'error';
    state.errorMsg = 'Nenhum link fornecido.';
  }
  render();
}

/* ============================== render ============================== */
function render() {
  const app = document.getElementById('app');
  if (state.route === 'loading') app.innerHTML = renderLoading();
  else if (state.route === 'error') app.innerHTML = renderError();
  else if (state.route === 'admin-login') app.innerHTML = renderAdminLogin();
  else if (state.route === 'admin') app.innerHTML = renderAdmin();
  else if (state.route === 'primo') app.innerHTML = renderPrimoView();

  if (state.toast) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = state.toast;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
    state.toast = null;
  }
}

function renderLoading() {
  return `<div class="center-screen"><div class="big-emoji">⏳</div><div>Carregando a vergonha…</div></div>`;
}

function renderError() {
  return `
    <div class="center-screen">
      <div class="big-emoji">🕵️</div>
      <div class="title" style="margin:0">Nada por aqui</div>
      <div style="color:var(--muted);font-size:0.9rem;max-width:280px">${esc(state.errorMsg)}</div>
    </div>`;
}

function renderAdminLogin() {
  return `
    <div class="center-screen">
      <div class="big-emoji">🔐</div>
      <div class="title" style="margin:0 0 4px">Alypay Admin</div>
      <div style="color:var(--muted);font-size:0.86rem">Só quem cobra entra aqui.</div>
      <form id="login-form" class="login-box">
        <div class="field" style="margin-top:18px">
          <label for="pw">Senha</label>

function pendCountDe(primoId) {

  return comprasDe(compras, primoId).filter((c) => c.status === 'pendente').length

}

function comprasDe(compras, primoId) { return compras.filter((c) => c.primo_id === primoId); }
function pagamentosDe(pagamentos, primoId) { return pagamentos.filter((p) => p.primo_id === primoId); }

function renderCard(primo, compras, pagamentos, isAdmin, pendCount = 0) {
  const hoje = mesAtual();
  const saldo = saldoTotal(compras, pagamentos);
  const vencido = saldoVencido(compras, pagamentos, hoje);
  const pago = somaPagamentos(pagamentos);
  const pct = pctQuitado(compras, pagamentos);
  const st = statusPrimo(saldo);
  const expanded = state.expandidos.has(primo.id);
  const faturaLinhas = faturaDoMes(compras, hoje);
  const faturaMes = round2(faturaLinhas.reduce((s, l) => s + l.parcela.valor, 0));
  const mesNome = formatMes(hoje).split(' de ')[0];

  const breakdown = expanded ? `
    <div class="cc-breakdown">
      <div class="cc-breakdown-item" style="font-weight:700">
        <span class="desc">Saldo total</span>
        <span class="val">${saldo < 0 ? formatBRL(Math.abs(saldo)) + ' de crédito' : formatBRL(saldo)}</span>
      </div>
      ${compras.length === 0
        ? `<div class="cc-breakdown-empty">Nenhuma compra lançada ainda. Aproveite enquanto dura. 😌</div>`
        : compras.map((c) => `
            <div class="cc-breakdown-item">
              <span class="desc">${esc(c.descricao)} · ${c.tipo === 'emprestimo' ? 'empréstimo' : (isRecorrente(c) ? 'mensal' : c.parcelas + 'x')}</span>
              <span class="val">${formatBRL(isRecorrente(c) ? totalAcumuladoAte(c, mesAtual()) : c.total)}</span>
            </div>`).join('')
      }
    </div>` : '';

  const pendente = pendCount > 0
    ? `<div class="cc-pending"${isAdmin ? ' data-action="ir-aprovacoes"' : ''}>⏳ ${pendCount} aguardando aprovação</div>`
    : '';

  return `
    <div class="cc">
      <div class="cc-top">
        <div class="cc-name-row">
          <div class="cc-name">${esc(primo.nome)}</div>
          ${isAdmin ? `<button class="cc-edit-btn" data-action="rename-primo" data-id="${primo.id}" title="Editar nome">✎</button>` : ''}
        </div>
        <div class="cc-status">${st.emoji} ${st.label}</div>
      </div>
      <div class="cc-balance-label">Fatura de ${mesNome}</div>
      <div class="cc-balance ${expanded ? 'expanded' : ''}" data-action="toggle-breakdown" data-id="${primo.id}">
        ${formatBRL(faturaMes)} <span class="chev">▾</span>
      </div>
      <div class="cc-sub">
        <div>Vencido<b>${formatBRL(vencido)}</b></div>
        <div>Pago<b>${formatBRL(pago)}</b></div>
      </div>
      <div class="cc-bar-track"><div class="cc-bar-fill" style="width:${pct}%"></div></div>
      <div class="cc-pct">${pct}% quitado</div>
      ${breakdown}
      ${pendente}
      ${isAdmin ? `
        <div class="cc-actions">
          <button data-action="copy-link" data-id="${primo.id}">🔗 Copiar link</button>
          <button data-action="regen-token" data-id="${primo.id}">♻️ Trocar link</button>
        </div>` : ''}
    </div>`;
}

function renderHistoricoDe(primo, compras, pagamentos, isAdmin) {
  const itens = [
    ...compras.map((c) => ({ tipo: 'compra', data: c.inicio_mes + '-01', item: c })),
    ...pagamentos.map((p) => ({ tipo: 'pagamento', data: p.data, item: p })),
  ].sort((a, b) => (a.data < b.data ? 1 : -1));

  const statusBadge = (item) => {
    if (item.status === 'pendente') return `<span class="badge-parc" style="color:var(--acc-c);border-color:var(--acc-c)">⏳ pendente</span>`;
    if (item.status === 'rejeitado') return `<span class="badge-parc" style="color:var(--danger);border-color:var(--danger)">❌ recusado</span>`;
    return '';
  };

  return `
    <div class="card">
      <h3>${esc(primo.nome)}</h3>
      ${itens.length === 0 ? `<div class="empty"><div class="big">🦗</div>Nenhum registro ainda.</div>` : itens.map((it) => {
        if (it.tipo === 'compra') {
          const c = it.item;
          const isEmprestimo = c.tipo === 'emprestimo';
          const meta = isEmprestimo
            ? `Empréstimo · ${c.prazo ? 'prazo ' + formatData(c.prazo) : 'prazo a definir'}`
            : (isRecorrente(c) ? `${formatBRL(c.total)}/mês (eterno)` : `${c.parcelas}x de ${formatBRL(parcelaValor(c, 0))}`);
          return `
            <div class="line-item">
              <div class="info">
                <div class="desc">${isEmprestimo ? '💵' : '🛍️'} ${esc(c.descricao)} ${statusBadge(c)}</div>
                <div class="meta">${meta} · desde ${formatMes(c.inicio_mes)}</div>
              </div>
              <div class="val">${isRecorrente(c) ? formatBRL(totalAcumuladoAte(c, mesAtual())) + ' até agora' : formatBRL(c.total)}</div>
              ${isAdmin ? `<button class="del" data-action="del-compra" data-id="${c.id}">excluir</button>` : ''}

        }
        const p = it.item;
        return `
          <div class="line-item">
            <div class="info">
              <div class="desc">💸 Pagamento${p.nota ? ' — ' + esc(p.nota) : ''} ${statusBadge(p)}</div>

            ${isAdmin ? `<button class="del" data-action="del-pagamento" data-id="${p.id}">excluir</button>` : ''}

      }).join('')}
    </div>`;
}

/* ============================== ações ============================== */
function showToast(msg) { state.toast = msg; render(); }

async function handleAdminAction(action, target) {
  const pw = state.adminPassword;
  try {
    if (action === 'tab') {
      state.activeTab = target.dataset.tab;
      render();
    } else if (action === 'mes-prev') {
      state.mes = somaMes(state.mes, -1); render();
    } else if (action === 'mes-next') {
      state.mes = somaMes(state.mes, 1); render();
    } else if (action === 'mes-hoje') {
      state.mes = mesAtual(); render();
    } else if (action === 'toggle-breakdown') {
      const id = target.dataset.id;
      state.expandidos.has(id) ? state.expandidos.delete(id) : state.expandidos.add(id);
      render();
    } else if (action === 'rename-primo') {
      const id = target.dataset.id;
      const primo = state.data.primos.find((p) => p.id === id);
      const novo = prompt('Novo nome:', primo.nome);
      if (novo && novo.trim() && novo.trim() !== primo.nome) {
        await API.updatePrimo(pw, id, { nome: novo.trim() });
        state.data = await API.adminData(pw);
        showToast('Nome atualizado.');
      }
    } else if (action === 'regen-token') {
      const id = target.dataset.id;
      if (confirm('Isso derruba o link antigo desse primo na hora. Continuar?')) {
        await API.updatePrimo(pw, id, { regenerar_token: true });
        state.data = await API.adminData(pw);
        showToast('Link renovado.');
      }
    } else if (action === 'copy-link') {
      const id = target.dataset.id;
      const primo = state.data.primos.find((p) => p.id === id);
      const url = `${location.origin}/?t=${primo.token_acesso}`;
      await navigator.clipboard.writeText(url);
      showToast('Link copiado.');
    } else if (action === 'copy-resumo') {
      await copiarResumoWhatsapp();
    } else if (action === 'export') {
      exportarBackup();
    } else if (action === 'import') {
      importarBackup();
    } else if (action === 'del-compra') {
      if (confirm('Excluir essa compra? Não dá pra desfazer.')) {
        await API.deleteCompra(pw, target.dataset.id);
        state.data = await API.adminData(pw);
        showToast('Compra excluída.');
      }
    } else if (action === 'del-pagamento') {
      if (confirm('Excluir esse pagamento? Não dá pra desfazer.')) {
        await API.deletePagamento(pw, target.dataset.id);
        state.data = await API.adminData(pw);
        showToast('Pagamento excluído.');
      }
    } else if (action === 'ir-aprovacoes') {
      state.activeTab = 'aprovacoes'; render();
    } else if (action === 'aprovar-compra') {
      await API.patchCompraStatus(pw, target.dataset.id, 'aprovado');
      state.data = await API.adminData(pw);
      showToast('Compra aprovada.');
    } else if (action === 'recusar-compra') {
      if (confirm('Recusar essa compra?')) {
        await API.patchCompraStatus(pw, target.dataset.id, 'rejeitado');
        state.data = await API.adminData(pw);
        showToast('Compra recusada.');
      }
    } else if (action === 'aprovar-pagamento') {
      await API.patchPagamentoStatus(pw, target.dataset.id, 'aprovado');
      state.data = await API.adminData(pw);
      showToast('Pagamento aprovado.');
    } else if (action === 'recusar-pagamento') {
      if (confirm('Recusar esse pagamento?')) {
        await API.patchPagamentoStatus(pw, target.dataset.id, 'rejeitado');
        state.data = await API.adminData(pw);
        showToast('Pagamento recusado.');
      }
    } else if (action === 'logout') {
      sessionStorage.removeItem('alypay_admin_pw');
      location.reload();
    }
  } catch (err) {
    showToast(err.message || 'Deu ruim.');
  }
}

function handlePrimoAction(action, target) {
  if (action === 'tab') { state.activeTab = target.dataset.tab; render(); }
  else if (action === 'mes-prev') { state.mes = somaMes(state.mes, -1); render(); }
  else if (action === 'mes-next') { state.mes = somaMes(state.mes, 1); render(); }
  else if (action === 'mes-hoje') { state.mes = mesAtual(); render(); }
  else if (action === 'toggle-breakdown') {
    const id = target.dataset.id;
    state.expandidos.has(id) ? state.expandidos.delete(id) : state.expandidos.add(id);
    render();
  }
}

async function copiarResumoWhatsapp() {
  const { primos, compras } = state.data;
  const linhas = [`*Boletim Anti-Calote — ${formatMes(state.mes)}*`, ''];
  for (const primo of primos) {
    const faturaLinhas = faturaDoMes(aprovados(comprasDe(compras, primo.id)), state.mes);
    const subtotal = round2(faturaLinhas.reduce((s, l) => s + l.parcela.valor, 0));
    const saldo = saldoTotal(aprovados(comprasDe(compras, primo.id)), aprovados(pagamentosDe(state.data.pagamentos, primo.id)));
    linhas.push(`*${primo.nome}* — saldo total ${formatBRL(saldo)}`);
    if (faturaLinhas.length === 0) {
      linhas.push('  nada vencendo esse mês');
    } else {
      for (const l of faturaLinhas) {
        linhas.push(`  • ${l.compra.descricao} (${parcelaBadge(l)}): ${formatBRL(l.parcela.valor)}`);
      }
      linhas.push(`  subtotal do mês: ${formatBRL(subtotal)}`);
    }
    linhas.push('');
  }
  await navigator.clipboard.writeText(linhas.join('\n'));
  showToast('Resumo copiado — cola no WhatsApp.');
}

function exportarBackup() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `alypay-backup-${mesAtual()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importarBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const payload = JSON.parse(text);
      if (!confirm('Isso vai sobrescrever registros com o mesmo ID. Continuar?')) return;
      await API.importBackup(state.adminPassword, payload);
      state.data = await API.adminData(state.adminPassword);
      showToast('Backup importado.');
      render();
    } catch (err) {
      showToast('Backup inválido: ' + err.message);
    }
  };
  input.click();
}

/* ============================== listeners globais ============================== */
document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  if (state.route === 'admin') handleAdminAction(action, target);
  else if (state.route === 'primo') handlePrimoAction(action, target);
});

document.addEventListener('submit', async (e) => {
  if (e.target.id === 'login-form') {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const ok = await API.adminLogin(pw);
    if (!ok) {
      state.loginError = 'Senha errada. Tenta de novo.';
      render();
      return;
    }
    state.adminPassword = pw;
    sessionStorage.setItem('alypay_admin_pw', pw);
    try {
      state.data = await API.adminData(pw);
      state.route = 'admin';
      render();
    } catch (err) {
      state.loginError = err.message;
      render();
    }
  } else if (e.target.id === 'compra-form') {
    e.preventDefault();
    const errEl = document.getElementById('c-error');
    errEl.hidden = true;
    try {
      const tipoSel = document.getElementById('c-tipo').value;
      const recorrente = tipoSel === 'recorrente';
      const emprestimo = tipoSel === 'emprestimo';
      const prazoIndef = document.getElementById('c-prazo-indefinido').checked;
      const prazoVal = document.getElementById('c-prazo').value;
      await API.createCompra(state.adminPassword, {
        primo_id: document.getElementById('c-primo').value,
        descricao: document.getElementById('c-desc').value,
        total: document.getElementById('c-total').value,
        parcelas: (recorrente || emprestimo) ? null : Number(document.getElementById('c-parcelas').value),
        inicio_mes: document.getElementById('c-mes').value,
        recorrente,
        tipo: emprestimo ? 'emprestimo' : 'compra',
        prazo: emprestimo && !prazoIndef && prazoVal ? prazoVal : null,
      });
      state.data = await API.adminData(state.adminPassword);
      showToast('Lançado.');
      render();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.hidden = false;
    }
  } else if (e.target.id === 'pagamento-form') {
    e.preventDefault();
    const errEl = document.getElementById('p-error');
    errEl.hidden = true;
    try {
      await API.createPagamento(state.adminPassword, {
        primo_id: document.getElementById('p-primo').value,
        valor: document.getElementById('p-valor').value,
        nota: document.getElementById('p-nota').value,
      });
      state.data = await API.adminData(state.adminPassword);
      showToast('Pagamento registrado.');
      render();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.hidden = false;
    }
  } else if (e.target.id === 'primo-compra-form') {
    e.preventDefault();
    const errEl = document.getElementById('pc-error');
    errEl.hidden = true;
    try {
      await API.createCompraPrimo(state.token, {
        descricao: document.getElementById('pc-desc').value,
        total: document.getElementById('pc-total').value,
        parcelas: Number(document.getElementById('pc-parcelas').value),
        inicio_mes: document.getElementById('pc-mes').value,
      });
      state.data = await API.primo(state.token);
      state.activeTab = 'historico';
      showToast('Enviado! Aguardando aprovação.');
      render();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.hidden = false;
    }
  } else if (e.target.id === 'primo-pagamento-form') {
    e.preventDefault();
    const errEl = document.getElementById('pp-error');
    errEl.hidden = true;
    try {
      await API.createPagamentoPrimo(state.token, {
        valor: document.getElementById('pp-valor').value,
        nota: document.getElementById('pp-nota').value,
      });
      state.data = await API.primo(state.token);
      state.activeTab = 'historico';
      showToast('Enviado! Aguardando aprovação.');
      render();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.hidden = false;
    }
  }
});

function updateCompraPreview() {
  const tipoEl = document.getElementById('c-tipo');
  if (!tipoEl) return;
  const tipo = tipoEl.value; // 'compra' | 'recorrente' | 'emprestimo'
  const total = Number(document.getElementById('c-total').value);
  const parcelas = Number(document.getElementById('c-parcelas').value) || 1;
  const preview = document.getElementById('c-preview');
  const parcelasField = document.getElementById('c-parcelas-field');
  const prazoField = document.getElementById('c-prazo-field');
  const prazoInput = document.getElementById('c-prazo');
  const prazoIndef = document.getElementById('c-prazo-indefinido');
  const totalLabel = document.getElementById('c-total-label');
  const mesLabel = document.getElementById('c-mes-label');

  parcelasField.hidden = tipo !== 'compra';
  document.getElementById('c-parcelas').required = tipo === 'compra';
  prazoField.hidden = tipo !== 'emprestimo';
  prazoInput.disabled = prazoIndef.checked;
  if (prazoIndef.checked) prazoInput.value = '';

  totalLabel.textContent = tipo === 'recorrente' ? 'Valor mensal (R$)' : tipo === 'emprestimo' ? 'Valor emprestado (R$)' : 'Valor total (R$)';
  mesLabel.textContent = tipo === 'compra' ? 'Mês da 1ª parcela' : tipo === 'emprestimo' ? 'Mês do empréstimo' : 'Mês de início';

  if (total > 0) {
    if (tipo === 'recorrente') {
      preview.textContent = `${formatBRL(total)} por mês, sem data de fim`;
    } else if (tipo === 'emprestimo') {
      const prazoTxt = prazoIndef.checked || !prazoInput.value ? 'prazo a definir' : `prazo ${formatData(prazoInput.value)}`;
      preview.textContent = `Empréstimo de ${formatBRL(total)} — ${prazoTxt}`;
    } else {
      preview.textContent = `${parcelas}x de ${formatBRL(total / parcelas)} (total ${formatBRL(total)})`;
    }
  } else {
    preview.textContent = 'Preencha o valor pra ver o preview.';
  }
}

document.addEventListener('input', (e) => {
  if (['c-total', 'c-parcelas', 'c-prazo'].includes(e.target.id)) updateCompraPreview();
});
document.addEventListener('change', (e) => {
  if (['c-tipo', 'c-prazo-indefinido', 'c-prazo'].includes(e.target.id)) updateCompraPreview();
});

boot();
</script>

<body>
<div id="app"></div>

<script>
/* ============================== estado ============================== */
const state = {
  route: 'loading', // loading | admin-login | admin | primo | error | portal
  errorMsg: '',
  adminPassword: sessionStorage.getItem('alypay_admin_pw') || '',
  loginError: '',
  data: null,        // admin: {primos, compras, pagamentos} | primo: {primo, compras, pagamentos}
  token: '',         // token do primo logado (rota /?t=...), usado pra ele lançar coisas
  activitySeenAt: localStorage.getItem('alypay_activity_seen_at') || null,
  activeTab: 'fatura',
  mes: mesAtual(),
  expandidos: new Set(),
  toast: null,
  portalAvatares: null,   // [{id, avatar}] carregado do /entrar
  portalSelecionado: null,
  portalError: '',
  pix: null,              // {disponivel, tipo, nome, codigo} carregado na tela do primo
  compraImportPrimoId: '',
  compraImportTexto: '',
  compraImportPreview: null,   // [{descricao, total, parcelas, inicio_mes}] aguardando confirmação
};

/* ============================== lógica pura ============================== */
function mesAtual() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function formatBRL(n) {
  return (n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function formatMes(mes) {
  const [y, m] = mes.split('-').map(Number);
  const nomes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${nomes[m - 1]} de ${y}`;
}
function somaMes(mes, delta) {
  const [y, m] = mes.split('-').map(Number);
  const total = (m - 1) + delta;
  const ny = y + Math.floor(total / 12);
  const nm = ((total % 12) + 12) % 12 + 1;
  return `${ny}-${String(nm).padStart(2, '0')}`;
}
// "Recorrente" = cobrança sem fim (ex: assinatura). Representada com
// parcelas = null; "total" nesse caso é o valor cobrado todo mês.
function isRecorrente(compra) { return compra.parcelas === null || compra.parcelas === undefined; }

// Quantos meses existem de "a" até "b", inclusive nas duas pontas
// (0 ou negativo se "b" vier antes de "a").
function mesesEntreInclusive(a, b) {
  const [y1, m1] = a.split('-').map(Number);
  const [y2, m2] = b.split('-').map(Number);
  return Math.max(0, (y2 - y1) * 12 + (m2 - m1) + 1);
}

function parcelaValor(compra, index) {
  if (isRecorrente(compra)) return compra.total;
  const base = Math.floor((compra.total / compra.parcelas) * 100) / 100;
  const soma = round2(base * (compra.parcelas - 1));
  const ultima = round2(compra.total - soma);
  return index === compra.parcelas - 1 ? ultima : base;
}

// Retorna a parcela (índice + valor) dessa compra que cai no mês
// informado, ou null se essa compra não tem nada vencendo nesse mês.
function parcelaNoMes(compra, mes) {
  const idx = mesesEntreInclusive(compra.inicio_mes, mes) - 1;
  if (idx < 0) return null;
  if (!isRecorrente(compra) && idx >= compra.parcelas) return null;
  return { index: idx, mes, valor: parcelaValor(compra, idx), recorrente: isRecorrente(compra) };
}

// Quanto dessa compra já "venceu" (ficou devido) até o mês de referência.
function totalAcumuladoAte(compra, mesRef) {
  if (isRecorrente(compra)) {
    return round2(mesesEntreInclusive(compra.inicio_mes, mesRef) * compra.total);
  }
  const decorridos = Math.min(compra.parcelas, mesesEntreInclusive(compra.inicio_mes, mesRef));
  if (decorridos <= 0) return 0;
  if (decorridos >= compra.parcelas) return Number(compra.total);
  const base = Math.floor((compra.total / compra.parcelas) * 100) / 100;
  return round2(base * decorridos);
}

function somaPagamentos(pagamentos) { return round2(pagamentos.reduce((s, p) => s + Number(p.valor), 0)); }

// Só lançamentos aprovados contam pro saldo. Itens sem "status" (backups
// antigos, de antes dessa coluna existir) são tratados como aprovados.
function aprovados(lista) { return lista.filter((x) => x.status === 'aprovado' || x.status === undefined); }

function formatData(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// Soma das compras pra fins de "saldo total": parceladas entram pelo
// total cheio (é um compromisso fechado); recorrentes entram só pelo
// quanto já venceu até hoje (não têm um "total futuro" definido).
function somaComprasParaSaldo(compras) {
  const hoje = mesAtual();
  return round2(compras.reduce((s, c) => s + (isRecorrente(c) ? totalAcumuladoAte(c, hoje) : Number(c.total)), 0));
}

function saldoTotal(compras, pagamentos) { return round2(somaComprasParaSaldo(compras) - somaPagamentos(pagamentos)); }

function saldoVencido(compras, pagamentos, mesRef) {
  const vencidas = compras.reduce((s, c) => s + totalAcumuladoAte(c, mesRef), 0);
  return Math.max(0, round2(vencidas - somaPagamentos(pagamentos)));
}

function isEmprestimo(compra) { return compra.tipo === 'emprestimo'; }

// Empréstimos em dinheiro não são fatura de cartão: não têm vencimento
// mensal e não devem inflar o "Vencido". Ficam numa linha própria
// ("Emprestado"), abatida pelo que sobrar do pagamento depois de cobrir
// o vencido do cartão (pagamento paga cartão primeiro, sobra vai pro
// empréstimo — mesma lógica de "pool único" que o resto do saldo já usa).
function splitCartaoEmprestimo(compras, pagamentos, mesRef) {
  const cartao = compras.filter((c) => !isEmprestimo(c));
  const emprestimos = compras.filter(isEmprestimo);
  const vencidoCartaoBruto = cartao.reduce((s, c) => s + totalAcumuladoAte(c, mesRef), 0);
  const emprestadoBruto = round2(emprestimos.reduce((s, c) => s + totalAcumuladoAte(c, mesRef), 0));
  const pago = somaPagamentos(pagamentos);
  const vencidoCartao = Math.max(0, round2(vencidoCartaoBruto - pago));
  const sobraPagamento = Math.max(0, round2(pago - vencidoCartaoBruto));
  const emprestado = Math.max(0, round2(emprestadoBruto - sobraPagamento));
  return { cartao, emprestimos, vencidoCartao, emprestadoBruto, emprestado };
}

// Total da fatura do cartão que vence no mês corrente (mesma conta que
// aparece no valor grande do cartão). Não inclui empréstimo nem meses
// passados — só o que cai no mês de hoje.
function faturaCartaoMesAtual(compras, pagamentos) {
  const hoje = mesAtual();
  const { cartao } = splitCartaoEmprestimo(compras, pagamentos, hoje);
  const linhas = faturaDoMes(cartao, hoje);
  return round2(linhas.reduce((s, l) => s + l.parcela.valor, 0));
}

function pctQuitado(compras, pagamentos) {
  const total = somaComprasParaSaldo(compras);
  const pago = somaPagamentos(pagamentos);
  if (total <= 0) return pago > 0 ? 100 : 0;
  return Math.min(100, Math.round((pago / total) * 100));
}

function faturaDoMes(compras, mes) {
  const linhas = [];
  for (const c of compras) {
    const p = parcelaNoMes(c, mes);
    if (p) linhas.push({ compra: c, parcela: p });
  }
  return linhas;
}
function statusPrimo(saldo) {
  if (saldo <= 0) return { emoji: '😇', label: 'Primo Exemplar', quip: 'Confesso, tô surpreso. Continua assim.' };
  if (saldo <= 200) return { emoji: '🙂', label: 'Devedor Simpático', quip: 'Só um lembretezinho...' };
  if (saldo <= 500) return { emoji: '🫠', label: 'Fase Enrolação', quip: 'Vamos conversar sobre isso?' };
  if (saldo <= 1500) return { emoji: '😬', label: 'Caloteiro Júnior', quip: 'Sério, de novo?' };
  return { emoji: '🚨', label: 'Caloteiro Sênior', quip: 'CADÊ O MEU DINHEIRO?!' };
}
function parcelaBadge(l) {
  if (l.compra.tipo === 'emprestimo') return 'empréstimo';
  return l.parcela.recorrente ? 'eterno' : `${l.parcela.index + 1}/${l.compra.parcelas}`;
}

// Monta um código Pix "copia e cola" (BR Code / EMV) na hora, com ou sem
// valor embutido — assim dá pra gerar tanto o da fatura do mês quanto um
// valor escolhido pelo primo, sem depender de um código estático fixo.
// CRC16/CCITT-FALSE (poly 0x1021, init 0xFFFF), padrão exigido pelo Pix.
function pixCRC16(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= (str.charCodeAt(i) << 8);
    for (let b = 0; b < 8; b++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function pixTLV(id, value) {
  return id + String(value.length).padStart(2, '0') + value;
}
function gerarPixCopiaCola(pix, valor) {
  const merchantAccount = pixTLV('00', 'br.gov.bcb.pix') + pixTLV('01', pix.chave);
  let payload = pixTLV('00', '01') + pixTLV('01', '11') + pixTLV('26', merchantAccount) + pixTLV('52', '0000') + pixTLV('53', '986');
  if (valor > 0) payload += pixTLV('54', valor.toFixed(2));
  payload += pixTLV('58', 'BR') + pixTLV('59', (pix.nome || '').slice(0, 25)) + pixTLV('60', (pix.cidade || '').slice(0, 15));
  payload += pixTLV('62', pixTLV('05', '***'));
  payload += '6304';
  return payload + pixCRC16(payload);
}

/* ============================== boot / roteamento ============================== */
async function boot() {
  const params = new URLSearchParams(location.search);
  const token = params.get('t');

  if (location.pathname.replace(/\/$/, '') === '/admin') {
    if (state.adminPassword) {
      try {
        state.data = await API.adminData(state.adminPassword);
        state.route = 'admin';
      } catch {
        sessionStorage.removeItem('alypay_admin_pw');
        state.adminPassword = '';
        state.route = 'admin-login';
      }
    } else {
      state.route = 'admin-login';
    }
  } else if (token) {
    state.token = token;
    try {
      state.data = await API.primo(token);
      state.route = 'primo';
      try { state.pix = await API.pix(); } catch { state.pix = null; }
    } catch (err) {
      state.route = 'error';
      state.errorMsg = err.message || 'Link inválido.';
    }
  } else if (location.pathname.replace(/\/$/, '') === '/entrar') {
    try {
      state.portalAvatares = await API.portalAvatares();
      state.route = 'portal';
    } catch (err) {
      state.route = 'error';
      state.errorMsg = err.message || 'Erro ao carregar o portal.';
    }
  } else {
    state.route = 'home';
  }
  render();
}

/* ============================== render ============================== */
function render() {
  const app = document.getElementById('app');
  if (state.route === 'loading') app.innerHTML = renderLoading();
  else if (state.route === 'home') app.innerHTML = renderHome();
  else if (state.route === 'error') app.innerHTML = renderError();
  else if (state.route === 'admin-login') app.innerHTML = renderAdminLogin();
  else if (state.route === 'admin') app.innerHTML = renderAdmin();
  else if (state.route === 'primo') app.innerHTML = renderPrimoView();
  else if (state.route === 'portal') app.innerHTML = renderPortal();

  if (state.toast) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = state.toast;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
    state.toast = null;
  }
}

// Cola o texto de uma fatura (mesmo layout tab-separated do C6: data
// completa, titular, últimos4, categoria do banco, estabelecimento,
// parcela "N/M" ou "Única", 0, 0, valor) e reconstrói cada linha como
// uma compra desse primo: parcelas = M, mês de início retrocedido (N-1)
// meses a partir do mês da transação, total = valor da parcela × M.
function parseFaturaC6ParaCompras(texto) {
  const itens = [];
  for (const raw of (texto || '').split('\n')) {
    const cols = raw.split('\t').map((c) => c.trim());
    if (cols.length < 9) continue;
    const dataM = cols[0].match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!dataM) continue;
    const [, , mesTxt, anoTxt] = dataM;
    const categoriaBanco = cols[3];
    const estabelecimento = cols[4];
    const parcelaTxt = cols[5];
    const valorTxt = cols[8];
    const valor = valorTxt.includes(',') ? Number(valorTxt.replace(/\./g, '').replace(',', '.')) : Number(valorTxt);
    if (!(valor > 0)) continue;
    if (/estorno/i.test(categoriaBanco) || /estorno/i.test(estabelecimento) || /inclusao de pagamento/i.test(estabelecimento)) continue;

    const parcelaM = parcelaTxt.match(/^(\d+)\/(\d+)$/);
    const n = parcelaM ? Number(parcelaM[1]) : 1;
    const parcelas = parcelaM ? Number(parcelaM[2]) : 1;

    let mesNum = Number(mesTxt) - (n - 1);
    let anoNum = Number(anoTxt);
    while (mesNum < 1) { mesNum += 12; anoNum -= 1; }

    itens.push({
      descricao: estabelecimento,
      total: round2(valor * parcelas),
      parcelas,
      inicio_mes: `${anoNum}-${String(mesNum).padStart(2, '0')}`,
    });
  }
  return itens;
}

// Mesma compra parcelada aparece de novo em faturas de meses seguintes
// com outro "N/M" — mas como o mês de início é retrocedido a partir
// disso, ela sempre bate no mesmo inicio_mes. Então: mesmo inicio_mes +
// mesmo total (± 1 centavo de arredondamento) numa compra que esse primo
// já tem = provável duplicata, o admin decide se remove.
function marcarDuplicadas(itens, comprasExistentes) {
  return itens.map((it) => {
    const bate = comprasExistentes.some((c) =>
      c.inicio_mes === it.inicio_mes && Math.abs(Number(c.total) - it.total) < 0.01
    );
    return { ...it, provavelDuplicada: bate };
  });
}

    if (item.status === 'rejeitado') return `<span class="badge-parc" style="color:var(--danger);border-color:var(--danger)">❌ recusado</span>`;

/* ============================== ações ============================== */
function showToast(msg) { state.toast = msg; render(); }

async function handleAdminAction(action, target) {
  const pw = state.adminPassword;
  try {
    if (action === 'tab') {
      state.activeTab = target.dataset.tab;
      if (target.dataset.tab === 'atividade') {
        state.activitySeenAt = new Date().toISOString();
        localStorage.setItem('alypay_activity_seen_at', state.activitySeenAt);
      }
      render();
    } else if (action === 'mes-prev') {
      state.mes = somaMes(state.mes, -1); render();
    } else if (action === 'mes-next') {
      state.mes = somaMes(state.mes, 1); render();
    } else if (action === 'mes-hoje') {
      state.mes = mesAtual(); render();
    } else if (action === 'toggle-breakdown') {
      const id = target.dataset.id;
      state.expandidos.has(id) ? state.expandidos.delete(id) : state.expandidos.add(id);
      render();
    } else if (action === 'rename-primo') {
      const id = target.dataset.id;
      const primo = state.data.primos.find((p) => p.id === id);
      const novo = prompt('Novo nome:', primo.nome);
      if (novo && novo.trim() && novo.trim() !== primo.nome) {
        await API.updatePrimo(pw, id, { nome: novo.trim() });
        state.data = await API.adminData(pw);
        showToast('Nome atualizado.');
      }
    } else if (action === 'regen-token') {
      const id = target.dataset.id;
      if (confirm('Isso derruba o link antigo desse primo na hora. Continuar?')) {
        await API.updatePrimo(pw, id, { regenerar_token: true });
        state.data = await API.adminData(pw);
        showToast('Link renovado.');
      }
    } else if (action === 'copy-link') {
      const id = target.dataset.id;
      const primo = state.data.primos.find((p) => p.id === id);
      const url = `${location.origin}/?t=${primo.token_acesso}`;
      await navigator.clipboard.writeText(url);
      showToast('Link copiado.');
    } else if (action === 'ver-pin') {
      const id = target.dataset.id;
      let primo = state.data.primos.find((p) => p.id === id);
      if (!primo.pin_acesso) {
        await API.updatePrimo(pw, id, { gerar_pin: true });
        state.data = await API.adminData(pw);
        primo = state.data.primos.find((p) => p.id === id);
      }
      await navigator.clipboard.writeText(primo.pin_acesso);
      showToast(`PIN de ${primo.nome}: ${primo.pin_acesso} (copiado)`);
    } else if (action === 'copy-resumo') {
      await copiarResumoWhatsapp();
    } else if (action === 'export') {
      exportarBackup();
    } else if (action === 'import') {
      importarBackup();
    } else if (action === 'del-compra') {
      if (confirm('Excluir essa compra? Não dá pra desfazer.')) {
        await API.deleteCompra(pw, target.dataset.id);
        state.data = await API.adminData(pw);
        showToast('Compra excluída.');
      }
    } else if (action === 'del-pagamento') {
      if (confirm('Excluir esse pagamento? Não dá pra desfazer.')) {
        await API.deletePagamento(pw, target.dataset.id);
        state.data = await API.adminData(pw);
        showToast('Pagamento excluído.');
      }
    } else if (action === 'contestar-compra') {
      if (confirm('Contestar essa compra? Ela sai da conta até você decidir, mas o registro continua salvo.')) {
        await API.patchCompraStatus(pw, target.dataset.id, 'rejeitado');
        state.data = await API.adminData(pw);
        showToast('Compra contestada.');
      }
    } else if (action === 'restaurar-compra') {
      await API.patchCompraStatus(pw, target.dataset.id, 'aprovado');
      state.data = await API.adminData(pw);
      showToast('Compra restaurada.');
    } else if (action === 'contestar-pagamento') {
      if (confirm('Contestar esse pagamento? Ele sai da conta até você decidir, mas o registro continua salvo.')) {
        await API.patchPagamentoStatus(pw, target.dataset.id, 'rejeitado');
        state.data = await API.adminData(pw);
        showToast('Pagamento contestado.');
      }
    } else if (action === 'restaurar-pagamento') {
      await API.patchPagamentoStatus(pw, target.dataset.id, 'aprovado');
      state.data = await API.adminData(pw);
      showToast('Pagamento restaurado.');
    } else if (action === 'logout') {
      sessionStorage.removeItem('alypay_admin_pw');
      location.reload();
    } else if (action === 'compra-import-processar') {
      if (!state.compraImportPrimoId) { showToast('Selecione o primo antes de processar.'); return; }
      const existentes = state.data.compras.filter((c) => c.primo_id === state.compraImportPrimoId && c.status !== 'rejeitado');
      state.compraImportPreview = marcarDuplicadas(parseFaturaC6ParaCompras(state.compraImportTexto), existentes);
      render();
    } else if (action === 'compra-import-remover') {
      state.compraImportPreview.splice(Number(target.dataset.idx), 1);
      render();
    } else if (action === 'compra-import-confirmar') {
      if (!state.compraImportPrimoId) { showToast('Selecione o primo.'); return; }
      if (!state.compraImportPreview || state.compraImportPreview.length === 0) return;
      const duplicadas = state.compraImportPreview.filter((it) => it.provavelDuplicada).length;
      if (duplicadas > 0 && !confirm(`${duplicadas} ite${duplicadas > 1 ? 'ns parecem' : 'm parece'} já lançado(s) antes (mesmo mês e valor). Confirmar mesmo assim?`)) return;
      await API.importarCompras(pw, state.compraImportPrimoId, state.compraImportPreview);
      state.compraImportPreview = null;
      state.compraImportTexto = '';
      state.data = await API.adminData(pw);
      showToast('Compras lançadas.');
    }
  } catch (err) {
    showToast(err.message || 'Deu ruim.');
  }
}

async function handlePrimoAction(action, target) {
  if (action === 'tab') { state.activeTab = target.dataset.tab; render(); }
  else if (action === 'mes-prev') { state.mes = somaMes(state.mes, -1); render(); }
  else if (action === 'mes-next') { state.mes = somaMes(state.mes, 1); render(); }
  else if (action === 'mes-hoje') { state.mes = mesAtual(); render(); }
  else if (action === 'toggle-breakdown') {
    const id = target.dataset.id;
    state.expandidos.has(id) ? state.expandidos.delete(id) : state.expandidos.add(id);
    render();
  } else if (action === 'copy-pix-fatura') {
    const valor = Number(target.dataset.valor);
    await navigator.clipboard.writeText(gerarPixCopiaCola(state.pix, valor));
    showToast('Código Pix copiado — valor da fatura do mês.');
  } else if (action === 'copy-pix-custom') {
    const input = document.getElementById('pix-valor-custom');
    const valor = Number((input.value || '').replace(',', '.'));
    if (!valor || valor <= 0) { showToast('Digita um valor válido.'); return; }
    await navigator.clipboard.writeText(gerarPixCopiaCola(state.pix, valor));
    showToast('Código Pix copiado.');
  }
}

async function copiarResumoWhatsapp() {
  const { primos, compras } = state.data;
  const linhas = [`*Boletim Anti-Calote — ${formatMes(state.mes)}*`, ''];
  for (const primo of primos) {
    const faturaLinhas = faturaDoMes(aprovados(comprasDe(compras, primo.id)), state.mes);
    const subtotal = round2(faturaLinhas.reduce((s, l) => s + l.parcela.valor, 0));
    const saldo = saldoTotal(aprovados(comprasDe(compras, primo.id)), aprovados(pagamentosDe(state.data.pagamentos, primo.id)));
    linhas.push(`*${primo.nome}* — saldo total ${formatBRL(saldo)}`);
    if (faturaLinhas.length === 0) {
      linhas.push('  nada vencendo esse mês');
    } else {
      for (const l of faturaLinhas) {
        linhas.push(`  • ${l.compra.descricao} (${parcelaBadge(l)}): ${formatBRL(l.parcela.valor)}`);
      }
      linhas.push(`  subtotal do mês: ${formatBRL(subtotal)}`);
    }
    linhas.push('');
  }
  await navigator.clipboard.writeText(linhas.join('\n'));
  showToast('Resumo copiado — cola no WhatsApp.');
}

function exportarBackup() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `alypay-backup-${mesAtual()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importarBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const payload = JSON.parse(text);
      if (!confirm('Isso vai sobrescrever registros com o mesmo ID. Continuar?')) return;
      await API.importBackup(state.adminPassword, payload);
      state.data = await API.adminData(state.adminPassword);
      showToast('Backup importado.');
      render();
    } catch (err) {
      showToast('Backup inválido: ' + err.message);
    }
  };
  input.click();
}

/* ============================== listeners globais ============================== */
document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  if (state.route === 'admin') handleAdminAction(action, target);
  else if (state.route === 'primo') handlePrimoAction(action, target);
  else if (state.route === 'portal') {
    if (action === 'portal-escolher') {
      state.portalSelecionado = target.dataset.id;
      state.portalError = '';
      render();
    } else if (action === 'portal-voltar') {
      state.portalSelecionado = null;
      state.portalError = '';
      render();
    }
  }
});

document.addEventListener('submit', async (e) => {
  if (e.target.id === 'portal-pin-form') {
    e.preventDefault();
    const pin = document.getElementById('portal-pin').value;
    try {
      const token = await API.portalEntrar(state.portalSelecionado, pin);
      location.href = `/?t=${encodeURIComponent(token)}`;
    } catch (err) {
      state.portalError = err.message;
      render();
    }
  } else if (e.target.id === 'login-form') {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const ok = await API.adminLogin(pw);
    if (!ok) {
      state.loginError = 'Senha errada. Tenta de novo.';
      render();
      return;
    }
    state.adminPassword = pw;
    sessionStorage.setItem('alypay_admin_pw', pw);
    try {
      state.data = await API.adminData(pw);
      state.route = 'admin';
      render();
    } catch (err) {
      state.loginError = err.message;
      render();
    }
  } else if (e.target.id === 'compra-form') {
    e.preventDefault();
    const errEl = document.getElementById('c-error');
    errEl.hidden = true;
    try {
      const tipoSel = document.getElementById('c-tipo').value;
      const recorrente = tipoSel === 'recorrente';
      const emprestimo = tipoSel === 'emprestimo';
      const prazoIndef = document.getElementById('c-prazo-indefinido').checked;
      const prazoVal = document.getElementById('c-prazo').value;
      await API.createCompra(state.adminPassword, {
        primo_id: document.getElementById('c-primo').value,
        descricao: document.getElementById('c-desc').value,
        total: document.getElementById('c-total').value,
        parcelas: (recorrente || emprestimo) ? null : Number(document.getElementById('c-parcelas').value),
        inicio_mes: document.getElementById('c-mes').value,
        recorrente,
        tipo: emprestimo ? 'emprestimo' : 'compra',
        prazo: emprestimo && !prazoIndef && prazoVal ? prazoVal : null,
      });
      state.data = await API.adminData(state.adminPassword);
      showToast('Lançado.');
      render();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.hidden = false;
    }
  } else if (e.target.id === 'pagamento-form') {
    e.preventDefault();
    const errEl = document.getElementById('p-error');
    errEl.hidden = true;
    try {
      await API.createPagamento(state.adminPassword, {
        primo_id: document.getElementById('p-primo').value,
        valor: document.getElementById('p-valor').value,
        nota: document.getElementById('p-nota').value,
      });
      state.data = await API.adminData(state.adminPassword);
      showToast('Pagamento registrado.');
      render();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.hidden = false;
    }
  } else if (e.target.id === 'primo-compra-form') {
    e.preventDefault();
    const errEl = document.getElementById('pc-error');
    errEl.hidden = true;
    try {
      await API.createCompraPrimo(state.token, {
        descricao: document.getElementById('pc-desc').value,
        total: document.getElementById('pc-total').value,
        parcelas: Number(document.getElementById('pc-parcelas').value),
        inicio_mes: document.getElementById('pc-mes').value,
      });
      state.data = await API.primo(state.token);
      state.activeTab = 'historico';
      showToast('Lançado! Já contabilizado.');
      render();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.hidden = false;
    }
  } else if (e.target.id === 'primo-pagamento-form') {
    e.preventDefault();
    const errEl = document.getElementById('pp-error');
    errEl.hidden = true;
    try {
      await API.createPagamentoPrimo(state.token, {
        valor: document.getElementById('pp-valor').value,
        nota: document.getElementById('pp-nota').value,
      });
      state.data = await API.primo(state.token);
      state.activeTab = 'historico';
      showToast('Lançado! Já contabilizado.');
      render();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.hidden = false;
    }
  }
});

function updateCompraPreview() {
  const tipoEl = document.getElementById('c-tipo');
  if (!tipoEl) return;
  const tipo = tipoEl.value; // 'compra' | 'recorrente' | 'emprestimo'
  const total = Number(document.getElementById('c-total').value);
  const parcelas = Number(document.getElementById('c-parcelas').value) || 1;
  const preview = document.getElementById('c-preview');
  const parcelasField = document.getElementById('c-parcelas-field');
  const prazoField = document.getElementById('c-prazo-field');
  const prazoInput = document.getElementById('c-prazo');
  const prazoIndef = document.getElementById('c-prazo-indefinido');
  const totalLabel = document.getElementById('c-total-label');
  const mesLabel = document.getElementById('c-mes-label');

  parcelasField.hidden = tipo !== 'compra';
  document.getElementById('c-parcelas').required = tipo === 'compra';
  prazoField.hidden = tipo !== 'emprestimo';
  prazoInput.disabled = prazoIndef.checked;
  if (prazoIndef.checked) prazoInput.value = '';

  totalLabel.textContent = tipo === 'recorrente' ? 'Valor mensal (R$)' : tipo === 'emprestimo' ? 'Valor emprestado (R$)' : 'Valor total (R$)';
  mesLabel.textContent = tipo === 'compra' ? 'Mês da 1ª parcela' : tipo === 'emprestimo' ? 'Mês do empréstimo' : 'Mês de início';

  if (total > 0) {
    if (tipo === 'recorrente') {
      preview.textContent = `${formatBRL(total)} por mês, sem data de fim`;
    } else if (tipo === 'emprestimo') {
      const prazoTxt = prazoIndef.checked || !prazoInput.value ? 'prazo a definir' : `prazo ${formatData(prazoInput.value)}`;
      preview.textContent = `Empréstimo de ${formatBRL(total)} — ${prazoTxt}`;
    } else {
      preview.textContent = `${parcelas}x de ${formatBRL(total / parcelas)} (total ${formatBRL(total)})`;
    }
  } else {
    preview.textContent = 'Preencha o valor pra ver o preview.';
  }
}

document.addEventListener('input', (e) => {
  if (['c-total', 'c-parcelas', 'c-prazo'].includes(e.target.id)) updateCompraPreview();
  if (e.target.id === 'compra-import-texto') state.compraImportTexto = e.target.value;
  if (e.target.dataset.compraImportField) {
    const idx = Number(e.target.dataset.idx);
    const field = e.target.dataset.compraImportField;
    state.compraImportPreview[idx][field] = field === 'descricao' || field === 'inicio_mes' ? e.target.value : Number(e.target.value);
  }
});
document.addEventListener('change', (e) => {
  if (['c-tipo', 'c-prazo-indefinido', 'c-prazo'].includes(e.target.id)) updateCompraPreview();
  if (e.target.id === 'compra-import-primo') state.compraImportPrimoId = e.target.value;
});

boot();
</script>

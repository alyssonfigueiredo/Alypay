<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alypay — Cobrança</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e2e4e9;
    --primary: #2563eb;
    --primary-text: #ffffff;
    --danger: #dc2626;
    --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --card: #1a1d24;
      --text: #f2f2f2;
      --muted: #9ca3af;
      --border: #2a2e37;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; font-size: 0.9rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-head h2 { font-size: 1rem; margin: 0; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  form .full { grid-column: 1 / -1; display: flex; gap: 10px; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  button.primary { background: var(--primary); color: var(--primary-text); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button.small { padding: 5px 10px; font-size: 0.8rem; }
  button.danger-text { background: transparent; color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge.pendente { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
  .badge.pago { background: rgba(22, 163, 74, 0.12); color: var(--ok); }
  .badge.vencida { outline: 1px solid var(--danger); }
  .empty { color: var(--muted); font-size: 0.85rem; padding: 12px 0; }
  .error { color: var(--danger); font-size: 0.85rem; margin-top: 8px; }
  .toggle-btn { background: var(--border); color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Alypay — Cobrança</h1>
  <p class="subtitle">Cadastre, edite e exclua dívidas por aqui — não precisa mais mexer na planilha. O envio automático via WhatsApp roda separado (cron).</p>

  <div class="card">
    <div class="card-head">
      <h2 id="form-title">Adicionar dívida</h2>
    </div>
    <form id="debtor-form">
      <input type="hidden" id="rowNumber" name="rowNumber" />
      <div>
        <label for="name">Nome</label>
        <input id="name" name="name" required />
      </div>
      <div>
        <label for="phone">Telefone</label>
        <input id="phone" name="phone" placeholder="41987925559" required />
      </div>
      <div>
        <label for="amount">Valor devido</label>
        <input id="amount" name="amount" placeholder="150,00" required />
      </div>
      <div>
        <label for="dueDate">Vencimento</label>
        <input id="dueDate" name="dueDate" placeholder="DD/MM/AAAA" required />
      </div>
      <div class="full">
        <button type="submit" class="primary" id="submit-btn">Adicionar</button>
        <button type="button" class="ghost" id="cancel-edit-btn" hidden>Cancelar edição</button>
      </div>
    </form>
    <div id="form-error" class="error" hidden></div>
  </div>

  <div class="card">
    <h2>Devedores</h2>
    <div id="table-wrap"></div>
  </div>
</div>

<script>
const form = document.getElementById('debtor-form');
const formTitle = document.getElementById('form-title');
const submitBtn = document.getElementById('submit-btn');
const cancelEditBtn = document.getElementById('cancel-edit-btn');
const errorEl = document.getElementById('form-error');

async function fetchDebtors() {
  const res = await fetch('/api/debtors');
  if (!res.ok) throw new Error('Falha ao carregar devedores');
  return res.json();
}

function isOverdue(dueDateStr) {
  const [d, m, y] = (dueDateStr || '').split('/').map(Number);
  if (!d || !m || !y) return false;
  const due = new Date(y, m - 1, d);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return due < today;
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function enterEditMode(debtor) {
  form.rowNumber.value = debtor.rowNumber;
  form.name.value = debtor.name;
  form.phone.value = debtor.phone;
  form.amount.value = debtor.amount;
  form.dueDate.value = debtor.dueDate;
  formTitle.textContent = `Editar dívida — ${debtor.name}`;
  submitBtn.textContent = 'Salvar alterações';
  cancelEditBtn.hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function exitEditMode() {
  form.reset();
  form.rowNumber.value = '';
  formTitle.textContent = 'Adicionar dívida';
  submitBtn.textContent = 'Adicionar';
  cancelEditBtn.hidden = true;
  errorEl.hidden = true;
}

cancelEditBtn.addEventListener('click', exitEditMode);

function render(debtors) {
  const wrap = document.getElementById('table-wrap');
  if (!debtors.length) {
    wrap.innerHTML = '<p class="empty">Nenhum devedor cadastrado ainda.</p>';
    return;
  }

  const rows = debtors.map((d) => {
    const status = (d.status || '').trim().toLowerCase();
    const overdue = status === 'pendente' && isOverdue(d.dueDate);
    const badgeClass = 'badge ' + (status === 'pago' ? 'pago' : 'pendente') + (overdue ? ' vencida' : '');
    const nextStatus = status === 'pago' ? 'pendente' : 'pago';
    const toggleLabel = status === 'pago' ? 'Marcar pendente' : 'Marcar pago';
    return `
      <tr data-row-data='${JSON.stringify(d).replace(/'/g, '&#39;')}'>
        <td>${escapeHtml(d.name)}</td>
        <td>${escapeHtml(d.phone)}</td>
        <td>${escapeHtml(String(d.amount))}</td>
        <td>${escapeHtml(d.dueDate)}</td>
        <td><span class="${badgeClass}">${escapeHtml(d.status || '—')}</span></td>
        <td>
          <div class="actions">
            <button class="small toggle-btn" data-action="toggle" data-row="${d.rowNumber}" data-status="${nextStatus}">${toggleLabel}</button>
            <button class="small ghost" data-action="edit" data-row="${d.rowNumber}">Editar</button>
            <button class="small danger-text" data-action="delete" data-row="${d.rowNumber}">Excluir</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');

  wrap.innerHTML = `
    <table>
      <thead>
        <tr><th>Nome</th><th>Telefone</th><th>Valor</th><th>Vencimento</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  wrap.querySelectorAll('button[data-action="toggle"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await fetch(`/api/debtors/${btn.dataset.row}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: btn.dataset.status }),
        });
        await refresh();
      } catch (err) {
        btn.disabled = false;
        alert('Erro ao atualizar status: ' + err.message);
      }
    });
  });

  wrap.querySelectorAll('button[data-action="edit"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const rowData = JSON.parse(btn.closest('tr').dataset.rowData);
      enterEditMode(rowData);
    });
  });

  wrap.querySelectorAll('button[data-action="delete"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const rowData = JSON.parse(btn.closest('tr').dataset.rowData);
      if (!confirm(`Excluir a dívida de "${rowData.name}"? Essa ação não pode ser desfeita.`)) return;
      btn.disabled = true;
      try {
        await fetch(`/api/debtors/${btn.dataset.row}`, { method: 'DELETE' });
        if (form.rowNumber.value === btn.dataset.row) exitEditMode();
        await refresh();
      } catch (err) {
        btn.disabled = false;
        alert('Erro ao excluir: ' + err.message);
      }
    });
  });
}

async function refresh() {
  const debtors = await fetchDebtors();
  render(debtors);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.hidden = true;
  const editingRow = form.rowNumber.value;
  const payload = {
    name: form.name.value,
    phone: form.phone.value,
    amount: form.amount.value,
    dueDate: form.dueDate.value,
  };
  try {
    const res = await fetch(editingRow ? `/api/debtors/${editingRow}` : '/api/debtors', {
      method: editingRow ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erro desconhecido');
    exitEditMode();
    await refresh();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.hidden = false;
  }
});

refresh().catch((err) => {
  document.getElementById('table-wrap').innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
});
</script>
</body>
</html>
